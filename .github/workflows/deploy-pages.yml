name: Publish Savta Shuli family album
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Import Eyal's approved portraits into the repository
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/import_eyal.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/eyal-casual.png assets/eyal-plonter.png
          if ! git diff --cached --quiet; then
            git commit -m "Store Eyal portraits as permanent local site assets"
            git push origin HEAD:main
          fi
      - name: Build the approved comic page
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/build_comic.py
      - name: Assemble Eyal's comic from four original illustrations
        run: |
          python scripts/build_eyal_comic.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/comics/eyal-panel-1.png assets/comics/eyal-panel-2.png assets/comics/eyal-panel-3.png assets/comics/eyal-panel-4.png
          if ! git diff --cached --quiet; then
            git commit -m "Store Eyal's four approved comic panels as permanent site files"
            git push origin HEAD:main
          fi
      - name: Archive Eyal's new memory panels in the repository
        continue-on-error: true
        run: |
          python scripts/import_eyal_story.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stories/eyal-memory-1.png assets/stories/eyal-memory-2.png assets/stories/eyal-memory-3.png assets/stories/eyal-memory-4.png
          if ! git diff --cached --quiet; then
            git commit -m "Archive Eyal's four latest approved family story panels"
            git push origin HEAD:main
          fi
      - name: Restore Eyal's original high-resolution story panels
        run: |
          python scripts/upgrade_eyal_story.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stories/eyal-memory-1.png assets/stories/eyal-memory-2.png assets/stories/eyal-memory-3.png assets/stories/eyal-memory-4.png
          if ! git diff --cached --quiet; then
            git commit -m "Replace blurred Eyal story panels with original full-resolution art"
            git push origin HEAD:main
          fi
      - name: Archive Eyal's elegant memory poster
        run: |
          python scripts/import_eyal_memory_poster.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/memories/eyal-plonter-elegant.png
          if ! git diff --cached --quiet; then
            git commit -m "Archive approved elegant poster in Eyal's character gallery"
            git push origin HEAD:main
          fi
      - name: Archive Ben's two approved childhood portraits
        run: |
          python scripts/import_ben_photos.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ben-child-white.png assets/ben-child-blue.png
          if ! git diff --cached --quiet; then
            git commit -m "Archive Ben childhood illustrations for family site"
            git push origin HEAD:main
          fi
      - name: Archive Ben's approved kneidlach comic page
        run: |
          python scripts/import_ben_kneidlach_comic.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/comics/ben-kneidlach-comic.png
          if ! git diff --cached --quiet; then
            git commit -m "Archive approved Ben and Grandma Shuli kneidlach comic"
            git push origin HEAD:main
          fi
      - name: Archive Yuval's approved full-body character portrait
        run: |
          python scripts/import_yuval_portrait.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/yuval-character.png
          if ! git diff --cached --quiet; then
            git commit -m "Archive approved Yuval character portrait"
            git push origin HEAD:main
          fi
      - name: Archive approved Yuval classroom catchphrase
        run: |
          python scripts/import_yuval_quote.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/quotes/yuval-grandma-remark.png
          if ! git diff --cached --quiet; then
            git commit -m "Archive Yuval's approved quote illustration"
            git push origin HEAD:main
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Confirm artifact registration
        run: sleep 20
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
