name: Publish Savta Shuli family album
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Import Eyal's approved portraits into the repository
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/import_eyal.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/eyal-casual.png assets/eyal-plonter.png
          if ! git diff --cached --quiet; then
            git commit -m "Store Eyal portraits as permanent local site assets"
            git push origin HEAD:main
          fi
      - name: Build the approved comic page
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/build_comic.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Confirm artifact registration
        run: sleep 20
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
