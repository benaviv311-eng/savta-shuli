<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>סבתא שולי – האלבום המשפחתי</title>
<style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff7ed;color:#57393b;min-height:90vh;display:grid;place-items:center;text-align:center;padding:30px}main{max-width:460px}h1{font-size:clamp(2rem,7vw,3rem)}p{line-height:1.7}.spin{border:4px solid #e5ccd1;border-top-color:#c5698f;border-radius:50%;width:35px;height:35px;animation:s 1s linear infinite;margin:24px auto}@keyframes s{to{transform:rotate(360deg)}}</style>
</head><body><main><h1>האלבום של סבתא שולי ❤️</h1><div class="spin"></div><p id="msg">טוענים את הזיכרונות והתמונות...</p></main>
<script>(async()=>{try{
const parts=await Promise.all(Array.from({length:19},async(_,i)=>{const n=String(i).padStart(2,'0');const r=await fetch('v2/parts/'+n+'.txt',{cache:'no-cache'});if(!r.ok)throw new Error('Missing album part '+n);return r.text()}));
let html=parts.join('').replaceAll('מלין','מילן');
html=html.replace('<button data-tab="memories">','<button data-tab="comics">עמודי קומיקס</button><button data-tab="memories">');
html=html.replace('<section id="memories" hidden>','<section id="comics" hidden><h2>עמודי קומיקס</h2><p class="sectionintro">הזיכרונות המשפחתיים שלנו, בעמודי קומיקס מאוירים. כל סיפור מקבל מקום משלו.</p><div class="comics-shelf" id="comicsShelf"></div></section><section id="memories" hidden>');
html=html.replace("['people','memories','quotes'].includes(initial)","['people','comics','memories','quotes'].includes(initial)");
if(!html.includes('id="comicsShelf"')||!html.includes('data-tab="comics"'))throw new Error('Comic section injection failed');
const css='<link rel="stylesheet" href="milan-slideshow.css?v=1">'+'<link rel="stylesheet" href="milan-storybook.css?v=1">'+'<link rel="stylesheet" href="comic-page.css?v=2">'+'<link rel="stylesheet" href="eyal-character.css?v=1">'+'<link rel="stylesheet" href="eyal-comic.css?v=1">'+'<link rel="stylesheet" href="eyal-story.css?v=1">'+'<link rel="stylesheet" href="eyal-memory-poster.css?v=1">'+'<link rel="stylesheet" href="eyal-quote.css?v=1">';
const script='<scr'+'ipt src="milan-slideshow.js?v=1"></scr'+'ipt>'+'<scr'+'ipt src="milan-storybook.js?v=1"></scr'+'ipt>'+'<scr'+'ipt src="comic-page.js?v=3"></scr'+'ipt>'+'<scr'+'ipt src="eyal-character.js?v=4"></scr'+'ipt>'+'<scr'+'ipt src="eyal-comic.js?v=1"></scr'+'ipt>'+'<scr'+'ipt src="eyal-story.js?v=2"></scr'+'ipt>'+'<scr'+'ipt src="eyal-memory-poster.js?v=1"></scr'+'ipt>'+'<scr'+'ipt src="eyal-quote.js?v=1"></scr'+'ipt>';
const enhanced=html.replace('</head>',css+'</head>').replace('</body>',script+'</body>');
if(!enhanced.includes('מילן חן')||!html.includes('צמה לכל יום')||!html.includes('סבתא שולי'))throw new Error('Incomplete album');
document.open();document.write(enhanced);document.close();
}catch(e){document.getElementById('msg').textContent='האתר לא נטען כרגע. נסו לרענן את הדף.';console.error(e)}})();</script>
</body></html>
